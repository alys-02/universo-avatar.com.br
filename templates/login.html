<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link rel="stylesheet" href="/estilos/conta.css">
</head>

<body>

    <main class="formulario-conta">

        <div class="caixa-conta">

            <h1>Entrar</h1>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <form method="post" action="/login">

                <input
                    type="text"
                    name="nome_usuario"
                    placeholder="Nome de usuário"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p>
                Não possui uma conta?
                <a href="/cadastro">Criar conta</a>
            </p>

        </div>

    </main>

</body>

</html>
